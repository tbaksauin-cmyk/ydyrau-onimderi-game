const key=(n,c)=>`${ATTEMPT_KEY}:${normName(n)}:${normClass(c)}`; const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function intro(msg=''){app.innerHTML=`<div class=card><h1>🧬 9-сынып Биология</h1><p><b>Тақырып:</b> Ыдырау үдерістері. Ас қорыту ферменттерінің әсері. Сіңіру және бөліп шығару</p><p>40 тапсырма • 30 минут • Жаттығу режимі • Бір жауап бекітілген соң өзгермейді.</p>${msg?`<p class='feedback danger'>${msg}</p>`:''}<label>Оқушының аты-жөні</label><input id=n placeholder='Аты-жөніңізді толық және дұрыс жазыңыз'><label>Сыныбы</label><input id=c placeholder='Мысалы: 9Ә'><button onclick=start()>Тестті бастау</button></div>`}
function start(){let n=document.getElementById('n').value,c=document.getElementById('c').value;if(!n.trim()||!c.trim())return intro('Аты-жөніңізді толық және дұрыс жазыңыз және сыныбыңызды енгізіңіз.');let k=key(n,c),old=JSON.parse(localStorage.getItem(k)||'null');if(old){s=old;if(s.sessionStatus==='COMPLETED'||s.sessionStatus==='PENDING_SUBMISSION')return result(true);if(s.sessionStatus==='IN_PROGRESS'||s.sessionStatus==='SUBMITTING'){if(Date.now()>=s.endTime)return finish('Уақыт аяқталды',true);return render()}}let order=shuffle(Q.map((_,i)=>i));let optionOrders={};order.forEach(i=>optionOrders[i]=shuffle([0,1,2,3]));let now=Date.now();s={TEST_ID,TEST_NAME,name:n.trim(),className:c.trim(),normalizedName:normName(n),normalizedClass:normClass(c),sessionStatus:'IN_PROGRESS',startTime:now,endTime:now+TEST_DURATION_MINUTES*60000,finishAllowedAt:now+MIN_FINISH_MINUTES*60000,order,optionOrders,locked:{},current:0};save();render()}
function save(){localStorage.setItem(key(s.name,s.className),JSON.stringify(s))}
function render(feedback=''){clearInterval(timer);if(Date.now()>=s.endTime)return finish('Уақыт аяқталды',true);let qi=s.order[s.current],q=Q[qi],locked=s.locked[qi],opts=s.optionOrders[qi];let score=Object.values(s.locked).filter(x=>x.correct).length*10;app.innerHTML=`<div class=card><div class=top><span class=pill>${s.name}</span><span class=pill>${s.className}</span><span class=pill id=t></span><span class=pill id=f></span><span class=pill>Ұпай: ${score}</span></div><h1>${s.current+1} / ${Q.length}</h1><div class=bar><i style='width:${(s.current/Q.length)*100}%'></i></div><h2>${q[0]}</h2><div id=opts>${opts.map(oi=>`<button class='opt ${selected===oi?'sel':''}' ${locked?'disabled':''} onclick='pick(${oi})'>${q[1][oi]}</button>`).join('')}</div>${feedback?`<div class=feedback>${feedback}</div>`:''}<div class=actions>${!locked?`<button id=lock ${selected===null?'disabled':''} onclick='lockAnswer()'>Жауапты бекіту</button>`:`<button onclick='next()'>${s.current===Q.length-1?'Сұрақтар аяқталды':'Келесі сұрақ'}</button>`}<button id=finish disabled onclick='finish("Оқушы аяқтады",false)'>Тестті аяқтау</button></div></div>`;tick();timer=setInterval(tick,500)}
function pick(i){selected=i;render()}
function lockAnswer(){if(selected===null)return;let qi=s.order[s.current],q=Q[qi],correct=selected===q[2];s.locked[qi]={answer:selected,correct};save();let fb=(correct?'✅ Дұрыс. ':'❌ Қате. Дұрыс жауап: '+q[1][q[2]]+'. ')+q[3];selected=null;render(fb)}
function next(){if(s.current<Q.length-1){s.current++;save();render()}else render('Барлық 40 сұрақ қаралды. Бекітілген жауаптарды өзгерту мүмкін емес. Ерте аяқтау уақыты өткен соң тестті аяқтай аласыз.')}
function tick(){let r=Math.max(0,s.endTime-Date.now()),fr=Math.max(0,s.finishAllowedAt-Date.now());let fmt=x=>`${String(Math.floor(x/60000)).padStart(2,'0')}:${String(Math.floor(x%60000/1000)).padStart(2,'0')}`;let te=document.getElementById('t'),fe=document.getElementById('f');if(te)te.textContent='Қалған уақыт: '+fmt(r);if(fe)fe.textContent=fr?'Аяқтауға: '+fmt(fr):'Аяқтауға болады';let b=document.getElementById('finish');if(b)b.disabled=fr>0;if(r<=0)finish('Уақыт аяқталды',true)}
function buildPayload(reason){let answers=s.order.map((qi,pos)=>{let l=s.locked[qi],q=Q[qi];return {number:pos+1,question:q[0],studentAnswer:l?q[1][l.answer]:'Жауап берілмеді',correctAnswer:q[1][q[2]],isCorrect:!!(l&&l.correct)}});let correct=answers.filter(a=>a.isCorrect).length,score=correct*10,maxScore=Q.length*10;return {testName:TEST_NAME,name:s.name,className:s.className,score,maxScore,correct,wrong:Q.length-correct,percent:Math.round(score/maxScore*100),answers,finishReason:reason,timeSpentSeconds:Math.min(TEST_DURATION_MINUTES*60,Math.round((Date.now()-s.startTime)/1000))}}
async function finish(reason,automatic){if(submitting)return;if(!automatic&&Date.now()<s.finishAllowedAt)return;if(!automatic&&!confirm('Тестті аяқтауға сенімдісіз бе?\n\nЖауап берілмеген сұрақтар қате болып есептеледі.\nАяқтағаннан кейін жауаптарды өзгерте алмайсыз және тестті қайта тапсыра алмайсыз.'))return;clearInterval(timer);submitting=true;s.sessionStatus='SUBMITTING';s.pendingPayload=buildPayload(reason);save();app.innerHTML=`<div class=card><h1>${automatic?'⏰ Уақыт аяқталды. Тест автоматты түрде аяқталды.':'Нәтиже сақталуда...'}</h1><p>Нәтиже Google Sheets жүйесіне жіберілуде...</p></div>`;try{await fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(s.pendingPayload)});s.sessionStatus='COMPLETED';s.completedAt=Date.now();save();result(false)}catch(e){s.sessionStatus='PENDING_SUBMISSION';save();result(false)}finally{submitting=false}}
function result(prior){let p=s.pendingPayload||buildPayload('Оқушы аяқтады'),grade=p.percent>=85?5:p.percent>=65?4:p.percent>=40?3:2,spent=Math.floor(p.timeSpentSeconds/60)+' мин '+p.timeSpentSeconds%60+' сек';app.innerHTML=`<div class=card><h1>📊 Тест нәтижесі</h1>${prior?'<p class="feedback danger">Сіз бұл тестті бұрын тапсырдыңыз. Қайта тапсыруға рұқсат жоқ.</p>':''}<p><b>Оқушы:</b> ${s.name}</p><p><b>Сыныбы:</b> ${s.className}</p><p><b>Нәтиже:</b> ${p.score} / ${p.maxScore}</p><p><b>Дұрыс:</b> ${p.correct} &nbsp; <b>Қате:</b> ${p.wrong}</p><p><b>Пайыз:</b> ${p.percent}% &nbsp; <b>Баға:</b> ${grade}</p><p><b>Жалпы уақыт:</b> ${TEST_DURATION_MINUTES} минут</p><p><b>Жұмсалған уақыт:</b> ${spent}</p><p><b>Аяқталу себебі:</b> ${p.finishReason||'Оқушы аяқтады'}</p>${s.sessionStatus==='PENDING_SUBMISSION'?`<div class='feedback danger'>Тест аяқталды. Нәтижені серверге жіберу күтілуде. Интернет қосылғанда осы бетті қайта ашыңыз.</div>`:''}</div>`}
window.addEventListener('online',async()=>{if(s&&s.sessionStatus==='PENDING_SUBMISSION'&&s.pendingPayload){try{await fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(s.pendingPayload)});s.sessionStatus='COMPLETED';save();result(false)}catch(e){}}});intro();
</script></body></html>
